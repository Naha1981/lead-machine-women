name: Demo E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/smoke-demo.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/demo-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_ID: lead-machine
      ENABLE_DEMO_MODE: "true"
      SIMULATE_WHATSAPP: "true"
      CRON_SECRET: smoke-secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Start development server
        run: |
          nohup bun run dev > /tmp/lead-machine-dev.log 2>&1 &
          echo $! > /tmp/lead-machine.pid
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lead-machine-dev.log
          exit 1
      - name: Run dentist end-to-end smoke test
        env:
          BASE_URL: http://127.0.0.1:3000
        run: bun scripts/smoke-demo.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/lead-machine-dev.log
