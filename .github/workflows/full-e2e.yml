name: Full E2E Audit

on:
  push:
    branches:
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_ID: lead-machine
      ENABLE_DEMO_MODE: "true"
      SIMULATE_WHATSAPP: "true"
      CRON_SECRET: smoke-secret
      ARTIFACT_DIR: artifacts/full-e2e
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_demo_only_not_for_real_auth
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright
        run: bun add --no-save playwright
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start server
        run: |
          nohup bun run dev > /tmp/lead-machine-full-e2e.log 2>&1 &
          echo $! > /tmp/lead-machine-full-e2e.pid
      - name: Wait for server
        run: |
          for i in $(seq 1 40); do
            if curl --silent --show-error --fail --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/lead-machine-full-e2e.log
          exit 1
      - name: Run full E2E audit
        env:
          BASE_URL: http://127.0.0.1:3000
        run: bun scripts/full-e2e.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/lead-machine-full-e2e.log
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-machine-full-e2e
          path: artifacts/full-e2e
          if-no-files-found: warn
